// All game logic and UI. Platform modules only add a launcher and speech.
plugins {
    id 'java-library'
}

dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Data validation reads ../assets/words.json.
    systemProperty 'assetsDir', rootProject.file('assets').absolutePath
    inputs.dir(rootProject.file('assets'))
}
